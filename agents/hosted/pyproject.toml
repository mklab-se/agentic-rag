[project]
name = "voltrieve-hosted-agent"
version = "0.1.0"
description = "Backend C: the Voltrieve agent core hosted in Foundry over the Invocations protocol"
requires-python = ">=3.12,<3.13"
dependencies = [
    "azure-ai-agentserver-invocations==1.3.0",
    "azure-ai-projects",
    "azure-identity",
    "aiohttp",
    "voltrieve-agent-core",
]

[tool.uv]
package = false

[tool.uv.sources]
voltrieve-agent-core = { path = "../../agent_core" }
voltrieve-search = { path = "../../search" }

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
