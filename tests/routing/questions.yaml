# Which knowledge bases should a question reach? `expect` lists the sources a thoughtful agent
# needs: none, docs, parts. `job` names an entry of data/generated/parts-index.json whose article
# numbers must all appear in the answer. `article` is resolved from the same file by key and
# vehicle, so no article number is written here.
questions:
  - { id: phone, group: curated, ask: "What is the phone number to Voltrieve?", expect: [curated], topic: contact }
  - { id: reach, group: curated, ask: "How can I get in touch with Voltrieve?", expect: [curated], topic: contact }
  - { id: hours, group: curated, ask: "What are the opening hours of Voltrieve?", expect: [curated], topic: opening_hours }
  - { id: hours-saturday, group: curated, ask: "Are you open on Saturdays?", expect: [curated], topic: opening_hours }
  - { id: broken-down, group: curated, ask: "My car has stopped on the motorway and won't start, who do I call?", expect: [curated], topic: roadside_assistance }
  - { id: smoke, group: curated, ask: "There is smoke coming from under my car!", expect: [curated], topic: battery_emergency }
  - { id: cancel, group: curated, ask: "I need to cancel my test drive tomorrow.", expect: [curated], topic: cancel_test_drive }
  - { id: privacy, group: curated, ask: "How do I get my personal data deleted?", expect: [curated], topic: personal_data }
  - { id: complain, group: curated, ask: "I'm unhappy with the service I got and want to complain.", expect: [curated], topic: complaints }

  - { id: greeting, group: none, ask: "Good morning!", expect: [] }
  - { id: thanks, group: none, ask: "Thanks, that was all I needed.", expect: [] }
  - { id: off-topic, group: none, ask: "What is the capital of France?", expect: [] }
  - { id: other-brand, group: none, ask: "Which brake pads fit a Tesla Model 3?", expect: [] }
  - { id: no-model, group: none, ask: "I have a car and I want to change the brakes on the left front side. Which parts do I need?", expect: [] }

  - { id: towing, group: docs, ask: "What is the towing capacity of the Fjord?", expect: [docs] }
  - { id: option-pack, group: docs, ask: "What does the Winter option pack contain?", expect: [docs] }
  - { id: filter-howto, group: docs, ask: "How often should the cabin air filter be changed?", expect: [docs] }
  - { id: trim-color-price, group: docs, ask: "What does the Fjord Plus AWD cost in Heath?", expect: [docs] }
  - { id: trim-adds, group: docs, ask: "What does the Fjord Plus have that the Fjord Pure does not?", expect: [docs] }
  - { id: pack-trims, group: docs, ask: "Which Fjord trims have the Sound pack included?", expect: [docs] }
  - { id: trim-wheels, group: docs, ask: "Which wheels does the Fjord come with on each trim?", expect: [docs] }
  - { id: boot-volumes, group: docs, ask: "How big is the Fjord boot, with the seats up and folded, and is there a frunk?", expect: [docs] }
  - { id: financing, group: docs, ask: "What is the monthly cost in the Fjord financing example, and at what interest rate?", expect: [docs] }
  - { id: battery-warranty, group: docs, ask: "How long is the battery warranty on the Ragn?", expect: [docs] }
  - { id: compare-models, group: docs, ask: "Compare the Lumen and the Ragn on range, starting price in Sweden and boot size.", expect: [docs] }
  - { id: ncap, group: docs, ask: "What is the Lumen's Euro NCAP rating?", expect: [docs] }

  - { id: windscreen, group: parts, ask: "What is the article number for the windscreen of the Voltrieve Atlas?", expect: [parts], article: { key: windscreen, fits: Voltrieve Atlas } }
  - { id: air-spring, group: parts, ask: "I need the rear left air spring for my Voltrieve Fjord. What is the article number?", expect: [parts], article: { key: rear_air_spring_rear_left, fits: Voltrieve Fjord } }
  - { id: wipers-fjord, group: parts, ask: "My windshield wipers on my Voltrieve Fjord need replacing. What is the article number?", expect: [parts], article: { key: wiper_blade_front, fits: Voltrieve Fjord } }
  - { id: winter-tyres-trim, group: parts, ask: "Which winter tyres fit my Voltrieve Fjord Plus?", expect: [parts] }
  - { id: winter-tyres-no-trim, group: parts, ask: "Which winter tyres do you have for the Voltrieve Fjord?", expect: [parts] }
  - { id: mirror-no-side, group: parts, ask: "The mirror on my Voltrieve Spark is broken. Which part do I need?", expect: [parts] }
  - { id: window-switch, group: parts, ask: "I need a new window switch for the rear left door of my Voltrieve Lumen. What is the article number?", expect: [parts], article: { key: window_switch_rear_left, fits: Voltrieve Lumen } }
  - { id: indicator, group: parts, ask: "The front right blinker on my Voltrieve Atlas is broken. Which part do I need?", expect: [parts], article: { key: indicator_front_right, fits: Voltrieve Atlas } }
  - { id: engine-oil, group: docs, ask: "Which engine oil should I use in my Voltrieve Ragn?", expect: [docs] }

  - { id: part-stock, group: stock, ask: "I've broken my right side mirror on my Voltrieve Spark. Do you have one in stock in Stockholm?", expect: [parts], tools: [check_part_stock], article: { key: door_mirror_right, fits: Voltrieve Spark } }
  - { id: part-stock-none, group: stock, ask: "Is article {article} in stock at any dealer?", expect: [parts], tools: [check_part_stock], pick: out_everywhere }

  - { id: reverse-lookup, group: parts, ask: "What is article {article} and which cars does it fit?", expect: [parts], reverse: { key: charge_port, fits: Voltrieve Ragn } }

  - { id: brakes-fjord, group: both, ask: "I have a Voltrieve Fjord AWD. I want to completely change the brakes on the left front side. Which spare parts do I need?", expect: [docs, parts], job: fjord/AWD/front/left }
  - { id: brakes-spark, group: both, ask: "I want to replace the complete rear right brake on my Voltrieve Spark. List every part with its article number.", expect: [docs, parts], job: spark/RWD/rear/right }
  - { id: brakes-atlas, group: both, ask: "What do I have to order for a complete front right brake replacement on a Voltrieve Atlas?", expect: [docs, parts], job: atlas/AWD/front/right }
  - { id: brakes-lumen, group: both, ask: "I own a Voltrieve Lumen and I need to redo the front left brake completely. What do I need to buy?", expect: [docs, parts], job: lumen/RWD/front/left, also_job: lumen/AWD/front/left }
