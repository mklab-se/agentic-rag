[project]
name = "voltrieve-entra"
version = "0.1.0"
description = "Creates the Voltrieve Entra app registrations through Microsoft Graph"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx",
    "azure-identity",
]

[project.scripts]
voltrieve-entra = "voltrieve_entra.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "respx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voltrieve_entra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
