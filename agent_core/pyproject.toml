[project]
name = "voltrieve-agent-core"
version = "0.1.0"
description = "Shared agent core for Voltrieve: events, tools, orchestration loop and server tools"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx",
    "jsonschema",
    "openai",
    "opentelemetry-instrumentation-httpx",
    "tzdata",
    "voltrieve-search",
]

[tool.uv.sources]
voltrieve-search = { path = "../search" }

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voltrieve_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
