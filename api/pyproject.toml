[project]
name = "voltrieve-api"
version = "0.1.0"
description = "Voltrieve Web API: one chat contract over interchangeable agent backends"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "PyJWT[crypto]",
    "httpx",
    "pydantic-settings",
    "jsonschema",
    "azure-identity",
    "aiohttp",
    "azure-ai-projects",
    "azure-monitor-opentelemetry",
    "opentelemetry-api",
    "voltrieve-agent-core",
    "voltrieve-search",
]

[tool.uv.sources]
voltrieve-agent-core = { path = "../agent_core" }
voltrieve-search = { path = "../search" }

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
