      - { key: pebble_graphite, name: Pebble, inches: 17, description: "flat aero wheel covers in graphite with five small holes" }
    interiors:
      - { key: grey_textile, name: Light grey textile, description: "light grey recycled textile seats and a pale wood strip across the dashboard" }
      - { key: grey_microsuede, name: Light grey textile and microsuede, description: "recycled textile seats with microsuede bolsters and a pale wood strip across the dashboard" }
    dimensions: { length_mm: 3700, width_mm: 1780, height_mm: 1590, wheelbase_mm: 2560, kerb_weight_kg: 1390, boot_l: 310, boot_folded_l: 1050, frunk_l: null, ground_clearance_mm: 160, roof_load_kg: 50 }
