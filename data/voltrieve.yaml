    copy_text:
      intro: >-
        The Atlas is a seven-seat SUV for big families and big plans. It carries seven people in
        three rows, tows a large caravan and still charges faster than any other Voltrieve.
      design: >-
        Tall bracket-shaped light columns frame each corner, front and rear. A long flat hood, a
        floating roof and brushed copper accents give the Atlas presence without shouting.
      interior: >-
        Three rows of seats, a wide wood and aluminium dashboard and a large driver display.
        Cognac Nappa leather on Prime.
      drive: >-
        Rear wheel steering makes the Atlas surprisingly easy to park, and air suspension keeps it
        calm on rough roads. All wheel drive is standard.
      practical: >-
        A third row that folds into the floor, a power outlet that runs tools or a coffee machine,
        and a frunk for the charging cables.
