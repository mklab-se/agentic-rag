company:
  name: Voltrieve
  tagline: Electric cars that retrieve the joy of driving
markets:
  - { code: SE, currency: SEK, price_rounding: 1000 }
  - { code: EU, currency: EUR, price_rounding: 100 }
awd_surcharge: { SE: 40000, EU: 3600 }
# Plus and Prime are priced as a share above Pure, rounded per market. Pure is the list price.
trim_steps: { Pure: 0.0, Plus: 0.08, Prime: 0.16 }
# Price of a color by finish. The hero color of each model is always included.
color_prices:
  solid: { SE: 0, EU: 0 }
  metallic: { SE: 9900, EU: 900 }
  pearl: { SE: 9900, EU: 900 }
  satin: { SE: 14900, EU: 1350 }
# Fictional terms from Voltrieve Financial Services, used for the worked example in the price lists.
financing:
  SE: { nominal_rate: 0.0495, deposit_share: 0.20, residual_share: 0.50, months: 36, setup_fee: 695, monthly_admin_fee: 59 }
  EU: { nominal_rate: 0.0445, deposit_share: 0.20, residual_share: 0.50, months: 36, setup_fee: 75, monthly_admin_fee: 6 }
# Example electricity prices for the charging guide, per kWh, fictional.
electricity:
  SE: { home_per_kwh: 1.8, public_ac_per_kwh: 4.5, public_dc_per_kwh: 6.9 }
  EU: { home_per_kwh: 0.30, public_ac_per_kwh: 0.49, public_dc_per_kwh: 0.69 }
price_list_valid_from: 1 November 2026
warranty:
  vehicle_years: 3
  vehicle_km: 100000
  battery_years: 8
  battery_km: 160000
  battery_min_capacity_percent: 70
  paint_years: 3
  corrosion_years: 12
  roadside_years: 3
  service_interval_months: 24
  service_interval_km: 30000
  notes:
    - The new car warranty covers defects in materials and workmanship for the whole car.
    - The battery warranty covers the high voltage battery, its modules and its control units. A battery that falls below 70 % of its original usable capacity within the period is repaired or replaced at no cost.
    - Roadside assistance is renewed for one year at each scheduled service at an authorised Voltrieve workshop, for as long as the car is serviced there.
    - Wear items such as tyres, brake pads, brake discs and wiper blades are not covered, and neither is damage from accidents, misuse or missing maintenance.
    - The warranty follows the car when it changes owner.
service_plans:
  - name: Voltrieve Care
    years: 3
    km: 60000
    includes: [scheduled services, brake fluid change, cabin air filter, wiper blades, software updates at the workshop]
    price_per_month: { SE: 249, EU: 24 }
  - name: Voltrieve Care Plus
    years: 5
    km: 100000
    includes: [everything in Voltrieve Care, brake pads and discs, 12 V battery, seasonal tyre change and storage, a courtesy car at each service]
    price_per_month: { SE: 549, EU: 52 }
# Sold by dealers. "part" points at a spare part (the article number comes from the parts data);
# accessories that are not spare parts carry their own article number.
accessories:
  floor_mats: { name: All weather floor mats, category: Protection and safety, description: "Set of 4 tailored rubber mats with raised edges", part: floor_mats, price: { SE: 1490, EU: 135 } }
  tow_bar: { name: Electric tow bar, category: Carrying and towing, description: "Electrically deployable tow bar with trailer stability control, retrofitted at the dealer, fitting included", part: tow_bar, price: { SE: 16900, EU: 1550 } }
  bike_carrier: { name: Tow bar bike carrier, category: Carrying and towing, description: "Tilting carrier for 2 bikes or e-bikes, up to 60 kg", article: VA-9031, price: { SE: 6490, EU: 595 } }
  home_charger: { name: Voltrieve Home Charger, category: Charging, description: "22 kW wall box with type 2 cable and app control, installation not included", article: VA-9001, price: { SE: 11900, EU: 1090 } }
  charge_cable_mode3: { name: Mode 3 charging cable, category: Charging, description: "5 m type 2 cable, 32 A, for public AC chargers", part: charge_cable_mode3, price: { SE: 2490, EU: 229 } }
  charge_cable_mode2: { name: Portable charger, category: Charging, description: "Mode 2 portable charger with Schuko plug, for occasional charging from a household socket", part: charge_cable_mode2, price: { SE: 4990, EU: 459 } }
  roof_bars: { name: Roof bars, category: Carrying and towing, description: "Pair of aluminium roof bars, rated for the maximum roof load of the car", article: VA-9011, price: { SE: 3990, EU: 365 } }
  roof_box: { name: Roof box, category: Carrying and towing, description: "420 litre roof box with dual side opening, fits on the roof bars", article: VA-9021, price: { SE: 7990, EU: 729 } }
  locking_bolt_set: { name: Locking wheel bolts, category: Protection and safety, description: "Set of 4 locking bolts with adapter", part: locking_bolt_set, price: { SE: 990, EU: 89 } }
  tyre_repair_kit: { name: Tyre repair kit, category: Protection and safety, description: "Sealant and 12 V compressor", part: tyre_repair_kit, price: { SE: 790, EU: 72 } }
  winter_wheels_spark: { name: Winter wheel set, category: Wheels and tyres, description: "Four complete 17 inch Pebble winter wheels with studless Nordic tyres and pressure sensors", article: VA-9101, price: { SE: 12900, EU: 1190 } }
  winter_wheels_lumen: { name: Winter wheel set, category: Wheels and tyres, description: "Four complete 18 inch Arc winter wheels with studless Nordic tyres and pressure sensors", article: VA-9102, price: { SE: 17900, EU: 1650 } }
  winter_wheels_ragn: { name: Winter wheel set, category: Wheels and tyres, description: "Four complete 19 inch Trail winter wheels with studded tyres and pressure sensors", article: VA-9103, price: { SE: 22900, EU: 2100 } }
  winter_wheels_fjord: { name: Winter wheel set, category: Wheels and tyres, description: "Four complete 19 inch Birch winter wheels with studless Nordic tyres and pressure sensors", article: VA-9104, price: { SE: 21900, EU: 2000 } }
  winter_wheels_atlas: { name: Winter wheel set, category: Wheels and tyres, description: "Four complete 21 inch Monolith winter wheels with studless Nordic tyres and pressure sensors", article: VA-9105, price: { SE: 29900, EU: 2750 } }
option_packs:
  Winter: { description: "heat pump, heated steering wheel and rear seats, battery preconditioning", price: { SE: 18000, EU: 1600 } }
  Pilot Plus: { description: "Voltrieve Pilot lane change assist and highway autopilot upgrade", price: { SE: 24000, EU: 2200 } }
  Tow: { description: "electrically deployable tow bar and trailer stability control", price: { SE: 14000, EU: 1300 } }
  Sound: { description: "14 speaker Voltrieve Stage audio system", price: { SE: 12000, EU: 1100 } }
