        A low centre of gravity and quick steering make the Lumen feel light on its feet. Choose
        rear wheel drive for efficiency or all wheel drive for grip and pace.
      practical: >-
        A hatchback tailgate, a flat folding rear seat and a frunk under the hood for the charging
