        Two thin light lines run across the full width of the car, front and rear, with no
        separate lamps at all. A sloping roof, frameless door glass and a sculpted hood finish
        the shape.
      interior: >-
        Black seats with coral stitching, a slim wide driver display and a floating touchscreen.
        A thin coral light line runs across the dashboard at night.
