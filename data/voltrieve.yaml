    company_car_benefit_sek: { Pure: 2150, Plus: 2350, Prime: 2550 }
    performance:
      RWD: { power_kw: 100, torque_nm: 220, zero_to_100_s: 9.2, top_speed_kmh: 150 }
    accent: "#A8740A"
    copy_text:
      intro: >-
        The Spark is the small car that makes the city feel bigger. It slips into gaps other cars
        drive past, turns on the spot and still seats four adults and their shopping.
      design: >-
        A rounded box with its wheels pushed out to the corners, two round ring lamps that look
        straight at you, and a contrasting roof. Simple shapes, made to be recognised from across
        the square.
      interior: >-
        Light grey recycled textile, a pale wood strip across the dashboard and a small round
        driver display. Calm, bright and easy to keep clean.
      drive: >-
        Rear wheel drive and a tight turning circle make the Spark quick and easy in town. One
        pedal driving lets you slow down and stop without touching the brake.
      practical: >-
        A near-vertical tailgate gives a square, useful boot, and the rear seats fold flat for the
        odd trip to the furniture store.
