[project]
name = "voltrieve-search"
version = "0.1.0"
description = "Azure AI Search definitions and apply tool for Voltrieve"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx",
    "azure-identity",
    "azure-storage-blob",
]

[project.scripts]
voltrieve-search = "voltrieve_search.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "respx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voltrieve_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]
