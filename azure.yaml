# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: voltrieve
services:
  dealer:
    project: ./services/dealer
    language: python
    host: containerapp
    docker:
      path: ./Dockerfile
      remoteBuild: true
  api:
    project: ./api
    language: python
    host: containerapp
    docker:
      path: Dockerfile
      context: ..
      remoteBuild: true
  web:
    project: ./clients/web
    language: ts
    host: staticwebapp
    dist: dist
hooks:
  preprovision:
    shell: sh
    run: hooks/preprovision.sh
    interactive: true
  postprovision:
    shell: sh
    run: hooks/postprovision.sh
  postup:
    shell: sh
    run: hooks/postup.sh
  predeploy:
    shell: sh
    run: hooks/predeploy.sh
