# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: voltrieve
services:
  dealer:
    project: ./services/dealer
    language: python
    host: containerapp
    docker:
      path: ./Dockerfile
      remoteBuild: true
  api:
    project: ./api
    language: python
    host: containerapp
    docker:
      path: Dockerfile
      context: ..
      remoteBuild: true
  web:
    project: ./clients/web
    language: ts
    host: staticwebapp
    dist: dist
    hooks:
      # Vite reads .env.production at build time, so this must run before the package step.
      prepackage:
        shell: sh
        run: ../../hooks/web-prepackage.sh
hooks:
  preprovision:
    shell: sh
    run: hooks/preprovision.sh
    interactive: true
  postprovision:
    shell: sh
    run: hooks/postprovision.sh
  postup:
    shell: sh
    run: hooks/postup.sh
workflows:
  # The default order packages before provision, which is too early: the web build needs
  # values that provision creates.
  up:
    steps:
      - azd: provision
      - azd: package --all
      - azd: deploy --all
