[project]
name = "voltrieve-cli"
version = "0.1.0"
description = "Terminal client for the Voltrieve agentic RAG API, with local client tools"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx",
    "msal",
    "msal-extensions",
    "rich",
    "typer",
]

[project.scripts]
voltrieve = "voltrieve_cli.main:app"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voltrieve_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
